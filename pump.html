    pipe: PIPE(),                // zusammen :: can link
    score: SCORE(),              // eigenständig :: own score

    result: RESULT,
    pressure: 0

  return {
    start() {

      return CACHE;

    stop() {
      CACHE.core.halt();        // keep CACHE
      return CACHE;

      // CACHE.score stays own

      return { together: true, eigenständig: true }
    },
    disconnect() {
      CACHE.pipe.unlink();
      CACHE.result.last = CACHE.pressure;
      // eigenständig wieder :: continues alone
      return CACHE;             // own CACHE retained
    },
    getScore() { return CACHE.score.value }
  }
}
